apiVersion: 1

datasources:
  - name: Prana Postgres
    type: postgres
    uid: prana-postgres
    access: proxy
    url: db:5432
    user: prana_ro
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_RO_PASSWORD}
