x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18.7-alpine
    container_name: prana-db
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-prana}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prana} -d ${POSTGRES_DB:-prana}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prana:
    build: ./app
    container_name: prana-app
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prana}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-prana}
      BOOTSTRAP_USERS: ${BOOTSTRAP_USERS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      TZ: ${TZ:-UTC}
      BACKUP_DIR: /backups
      BACKUP_CRON_HOUR: ${BACKUP_CRON_HOUR:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  db-test:
    image: postgres:18.7-alpine
    profiles: ["test"]
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: prana
      POSTGRES_PASSWORD: prana_test
      POSTGRES_DB: prana_test
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prana -d prana_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: ./app
      dockerfile: Dockerfile.test
    profiles: ["test"]
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://prana:prana_test@db-test:5432/prana_test
      PRANA_RO_DATABASE_URL: ${PRANA_RO_DATABASE_URL:-}
    volumes:
      - ./tests:/tests:ro
      - ./oura-ble:/oura-ble:ro
      - ./ARCHITECTURE.md:/ARCHITECTURE.md:ro

  oura-ble:
    build: ./oura-ble
    container_name: prana-oura-ble
    profiles: ["oura"]
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    logging: *default-logging
    environment:
      PRANA_INGEST_URL: http://localhost:9000/api/v1/ingest/oura
      OURA_INGEST_TOKEN: ${OURA_INGEST_TOKEN:-}
      OURA_DEVICE_NAME: ${OURA_DEVICE_NAME:-Oura Ring 4}
      OURA_SYNC_INTERVAL_SEC: ${OURA_SYNC_INTERVAL_SEC:-3600}
    volumes:
      - /var/run/dbus:/var/run/dbus
      - oura_data:/data

volumes:
  pgdata:
  oura_data:
