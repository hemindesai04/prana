x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18.7-alpine
    container_name: prana-db
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-prana}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prana} -d ${POSTGRES_DB:-prana}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prana:
    build: ./app
    container_name: prana-app
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prana}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-prana}
      BOOTSTRAP_USERS: ${BOOTSTRAP_USERS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      TZ: ${TZ:-UTC}
      BACKUP_DIR: /backups
      BACKUP_CRON_HOUR: ${BACKUP_CRON_HOUR:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MORNING_BRIEFING_HOUR: ${MORNING_BRIEFING_HOUR:-8}
      EVENING_BRIEFING_HOUR: ${EVENING_BRIEFING_HOUR:-22}
    volumes:
      - ./backups:/backups
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  db-test:
    image: postgres:18.7-alpine
    profiles: ["test"]
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: prana
      POSTGRES_PASSWORD: prana_test
      POSTGRES_DB: prana_test
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prana -d prana_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: ./app
      dockerfile: Dockerfile.test
    profiles: ["test"]
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://prana:prana_test@db-test:5432/prana_test
      PRANA_RO_DATABASE_URL: ${PRANA_RO_DATABASE_URL:-}
    volumes:
      - ./app/prana:/app/prana:ro
      - ./app/alembic:/app/alembic:ro
      - ./tests:/tests:ro
      - ./oura-ble:/oura-ble:ro
      - ./ARCHITECTURE.md:/ARCHITECTURE.md:ro

  oura-ble:
    build: ./oura-ble
    container_name: prana-oura-ble
    profiles: ["oura"]
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    logging: *default-logging
    environment:
      PRANA_INGEST_URL: http://localhost:9000/api/v1/ingest/oura
      OURA_INGEST_TOKEN: ${OURA_INGEST_TOKEN:-}
      OURA_DEVICE_NAME: ${OURA_DEVICE_NAME:-Oura Ring 4}
      OURA_SYNC_INTERVAL_SEC: ${OURA_SYNC_INTERVAL_SEC:-3600}
    volumes:
      - /var/run/dbus:/var/run/dbus
      - oura_data:/data

  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: prana-grafana
    profiles: ["dashboard"]
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-prana_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:9300
      POSTGRES_DB: ${POSTGRES_DB:-prana}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:-prana_ro}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  oura_data:
  grafana_data:
